<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="top">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box"><span class="score-label">Score</span><span id="score">0</span></div>
        <div class="score-box"><span class="score-label">Best</span><span id="best">0</span></div>
      </div>
    </header>

    <div class="controls">
      <p class="hint">Join the tiles to reach 2048. Use arrow keys, WASD, or swipe.</p>
      <div class="buttons">
        <button id="undo" type="button">Undo</button>
        <button id="new-game" type="button" class="primary">New game</button>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="2048 board"></div>
      <div id="message" class="message" hidden>
        <p id="message-text"></p>
        <div class="buttons">
          <button id="keep-going" type="button">Keep going</button>
          <button id="try-again" type="button" class="primary">New game</button>
        </div>
      </div>
    </div>
  </main>

  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
